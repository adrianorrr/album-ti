<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Figurinha - Copa 2026</title>

  <script src="./assets/gsap.min.js"></script>

  <style>
    :root {
      --bg-1: #020617;
      --gold: #ffd76a;
      --gold-2: #ffb703;
      --blue: #2f80ff;
      --red: #ff3b5f;
      --green: #00d084;
      --white: #f8fafc;
      --card-border: rgba(255, 255, 255, 0.22);
      --pack-w: min(70vw, 285px);
      --pack-h: calc(var(--pack-w) * 1.38);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-1);
      color: var(--white);
    }

    body {
      min-height: 100vh;
    }

    button {
      font: inherit;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px 12px 30px;
      overflow-x: hidden;
      overflow-y: auto;
      background:
        radial-gradient(circle at 50% 18%, rgba(47, 128, 255, 0.38), transparent 34%),
        radial-gradient(circle at 8% 16%, rgba(255, 59, 95, 0.18), transparent 30%),
        radial-gradient(circle at 92% 20%, rgba(0, 208, 132, 0.16), transparent 30%),
        linear-gradient(180deg, #06122a 0%, #020617 68%, #01040b 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, transparent, black 14%, black 68%, transparent);
      pointer-events: none;
    }

    .stadium {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .stadium::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -72px;
      width: 120vw;
      height: 230px;
      transform: translateX(-50%);
      border-radius: 50% 50% 0 0;
      background:
        radial-gradient(ellipse at center, rgba(0, 208, 132, 0.24), transparent 58%),
        linear-gradient(180deg, rgba(4, 120, 87, 0.55), rgba(2, 6, 23, 0.95));
      box-shadow: 0 -30px 100px rgba(0, 208, 132, 0.15);
    }

    .stadium-line {
      position: absolute;
      left: 50%;
      bottom: 70px;
      width: min(620px, 92vw);
      height: 90px;
      transform: translateX(-50%);
      border: 2px solid rgba(255, 255, 255, 0.14);
      border-bottom: none;
      border-radius: 50% 50% 0 0;
      opacity: 0.65;
    }

    .light {
      position: absolute;
      top: -80px;
      width: 180px;
      height: 82vh;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.24), transparent 78%);
      filter: blur(18px);
      opacity: 0.5;
      transform-origin: top center;
      mix-blend-mode: screen;
    }

    .light.left {
      left: 5%;
      transform: rotate(24deg);
    }

    .light.right {
      right: 5%;
      transform: rotate(-24deg);
    }

    .light.center {
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      opacity: 0.33;
    }

    .app {
      position: relative;
      z-index: 2;
      width: min(100%, 460px);
      min-height: calc(100vh - 106px);
      display: grid;
      place-items: center;
      perspective: 1200px;
    }

    .stage {
      position: relative;
      width: 100%;
      min-height: calc(var(--pack-h) + 118px);
      display: grid;
      place-items: center;
      perspective: 1100px;
    }

    .pack-button {
      position: relative;
      width: var(--pack-w);
      height: var(--pack-h);
      border: 0;
      background: transparent;
      cursor: pointer;
      color: inherit;
      transform-style: preserve-3d;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 34px 45px rgba(0, 0, 0, 0.5));
      z-index: 5;
    }

    .pack-button:focus-visible {
      outline: 3px solid rgba(255, 215, 106, 0.9);
      outline-offset: 12px;
      border-radius: var(--radius);
    }

    .pack-shell {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      border-radius: var(--radius);
    }

    .pack-shadow {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: -38px;
      height: 46px;
      border-radius: 999px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.7), transparent 70%);
      filter: blur(10px);
      transform: translateZ(-60px);
    }

    .pack-base,
    .pack-front,
    .pack-piece {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.22);
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.28), transparent 20%),
        radial-gradient(circle at 80% 8%, rgba(0, 208, 132, 0.2), transparent 24%),
        linear-gradient(135deg, rgba(255, 59, 95, 0.95) 0%, rgba(18, 77, 196, 0.98) 36%, rgba(3, 18, 44, 1) 64%, rgba(0, 208, 132, 0.78) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.12),
        inset 0 26px 60px rgba(255, 255, 255, 0.08),
        inset 0 -30px 80px rgba(0, 0, 0, 0.34),
        0 30px 80px rgba(0, 0, 0, 0.46);
      backface-visibility: hidden;
    }

    .pack-base {
      transform: translateZ(-12px) scale(0.985);
      filter: brightness(0.72);
    }

    .pack-front {
      transform: translateZ(20px);
    }

    .pack-front::before,
    .pack-piece::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        linear-gradient(115deg, transparent 0%, rgba(255, 255, 255, 0.04) 22%, rgba(255, 255, 255, 0.45) 34%, transparent 46%),
        repeating-linear-gradient(60deg, rgba(255, 255, 255, 0.08) 0 1px, transparent 1px 13px);
      transform: translateX(-36%) rotate(8deg);
      animation: foilMove 4.8s linear infinite;
      mix-blend-mode: screen;
      opacity: 0.9;
    }

    .pack-front::after,
    .pack-piece::after {
      content: "";
      position: absolute;
      inset: 13px;
      border-radius: calc(var(--radius) - 10px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        inset 0 0 24px rgba(255, 215, 106, 0.18),
        0 0 30px rgba(47, 128, 255, 0.18);
      pointer-events: none;
    }

    @keyframes foilMove {
      0% {
        transform: translateX(-42%) rotate(8deg);
      }

      100% {
        transform: translateX(42%) rotate(8deg);
      }
    }

    .pack-content {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 24px 22px 22px;
      isolation: isolate;
    }

    .pack-content::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 78%;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -45%);
      background:
        radial-gradient(circle, rgba(255, 215, 106, 0.45), transparent 60%),
        conic-gradient(from 120deg, rgba(255, 255, 255, 0.12), rgba(255, 215, 106, 0.38), rgba(47, 128, 255, 0.22), rgba(255, 59, 95, 0.22), rgba(255, 255, 255, 0.12));
      filter: blur(1px);
      opacity: 0.95;
      z-index: -1;
    }

    .pack-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
    }

    .mini-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
    }

    .mini-badge span {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--gold);
      box-shadow: 0 0 16px var(--gold);
    }

    .pack-center {
      display: grid;
      place-items: center;
      text-align: center;
      padding-top: 14px;
    }

    .world-ball {
      position: relative;
      width: 102px;
      aspect-ratio: 1;
      margin-bottom: 16px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 28%, #ffffff 0 6%, transparent 7%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.95) 0 34%, transparent 35%),
        conic-gradient(from 40deg, var(--red), var(--blue), var(--green), var(--gold), var(--red));
      box-shadow:
        0 0 34px rgba(255, 215, 106, 0.45),
        inset 0 0 28px rgba(0, 0, 0, 0.18);
    }

    .world-ball::before,
    .world-ball::after {
      content: "";
      position: absolute;
      inset: 17%;
      border-radius: 50%;
      border: 2px solid rgba(2, 6, 23, 0.34);
    }

    .world-ball::after {
      inset: 35% 8%;
      height: 24%;
      top: 38%;
      border-left: 0;
      border-right: 0;
      border-radius: 0;
      transform: rotate(-16deg);
    }

    .pack-title {
      font-size: 38px;
      line-height: 0.84;
      font-weight: 950;
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow:
        0 5px 0 rgba(0, 0, 0, 0.18),
        0 18px 32px rgba(0, 0, 0, 0.36);
    }

    .pack-title strong {
      display: block;
      color: var(--gold);
      letter-spacing: 0;
      text-shadow:
        0 0 22px rgba(255, 215, 106, 0.48),
        0 5px 0 rgba(0, 0, 0, 0.2);
    }

    .pack-subtitle {
      margin-top: 14px;
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(2, 6, 23, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.82);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .pack-bottom {
      display: grid;
      gap: 10px;
    }

    .color-strip {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.12);
    }

    .color-strip span:nth-child(1) {
      background: var(--blue);
    }

    .color-strip span:nth-child(2) {
      background: var(--gold);
    }

    .color-strip span:nth-child(3) {
      background: var(--green);
    }

    .pack-small {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255, 255, 255, 0.76);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .barcode {
      display: flex;
      gap: 3px;
      height: 22px;
      opacity: 0.72;
    }

    .barcode i {
      display: block;
      width: 2px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 999px;
    }

    .barcode i:nth-child(2n) {
      height: 14px;
    }

    .barcode i:nth-child(3n) {
      width: 4px;
    }

    .tear-line {
      position: absolute;
      top: 22%;
      left: 6%;
      right: 6%;
      height: 2px;
      z-index: 8;
      transform: scaleX(0);
      transform-origin: left center;
      background:
        linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent),
        repeating-linear-gradient(90deg, transparent 0 10px, rgba(255, 255, 255, 0.95) 10px 16px);
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.85));
      opacity: 0;
    }

    .pack-piece {
      opacity: 0;
      z-index: 7;
      transform: translateZ(32px);
      pointer-events: none;
    }

    .piece-top {
      clip-path: polygon(0 0, 100% 0, 100% 25%, 72% 22%, 52% 26%, 32% 21%, 0 25%);
      transform-origin: center 20%;
    }

    .piece-left {
      clip-path: polygon(0 20%, 52% 25%, 45% 100%, 0 100%);
      transform-origin: left center;
    }

    .piece-right {
      clip-path: polygon(48% 25%, 100% 20%, 100% 100%, 55% 100%);
      transform-origin: right center;
    }

    .tap-hint {
      position: absolute;
      left: 50%;
      bottom: -58px;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.86);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(14px);
      white-space: nowrap;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      pointer-events: auto;
    }

    .tap-hint span {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--gold);
      box-shadow: 0 0 18px var(--gold);
    }

    .sticker-card {
      position: absolute;
      width: min(74vw, 312px);
      aspect-ratio: 0.68;
      z-index: 4;
      opacity: 0;
      transform-style: preserve-3d;
      border-radius: 28px;
      padding: 12px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.7) 12%, rgba(255, 255, 255, 0) 36%),
        linear-gradient(180deg, #ffffff 0%, #f8fbff 52%, #eef5ff 100%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.45),
        0 34px 90px rgba(0, 0, 0, 0.48),
        0 0 80px rgba(255, 215, 106, 0.22);
      overflow: hidden;
      pointer-events: none;
    }

    .sticker-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 59, 95, 0.18), transparent 20%),
        radial-gradient(circle at 82% 20%, rgba(47, 128, 255, 0.18), transparent 21%),
        radial-gradient(circle at 50% 90%, rgba(0, 208, 132, 0.14), transparent 24%);
      pointer-events: none;
    }

    .sticker-card::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 20px;
      border: 1.5px solid rgba(18, 77, 196, 0.08);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7);
      pointer-events: none;
    }

    .sticker-shine {
      position: absolute;
      top: -30%;
      left: -85%;
      z-index: 5;
